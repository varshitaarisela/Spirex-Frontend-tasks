
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Quiz App</title>
    <link rel="stylesheet" href="style8.css">
</head>
<body>

    <div class="quiz-container">
        <h1>My Quiz App</h1>
        

        <form id="quizForm">

            <!-- Question 1 -->
            <div class="question">
                <h3>1. Which language is used to structure a webpage?</h3>

                <label>
                    <input type="radio" name="q1" value="a">
                    A) CSS
                </label>

                <label>
                    <input type="radio" name="q1" value="b">
                    B) HTML
                </label>

                <label>
                    <input type="radio" name="q1" value="c">
                    C) Python
                </label>

                <label>
                    <input type="radio" name="q1" value="d">
                    D) Java
                </label>
            </div>

            <!-- Question 2 -->
            <div class="question">
                <h3>2. Which language is used to style webpages?</h3>

                <label>
                    <input type="radio" name="q2" value="a">
                    A) JavaScript
                </label>

                <label>
                    <input type="radio" name="q2" value="b">
                    B) Python
                </label>

                <label>
                    <input type="radio" name="q2" value="c">
                    C) CSS
                </label>

                <label>
                    <input type="radio" name="q2" value="d">
                    D) HTML
                </label>
            </div>

            <!-- Question 3 -->
            <div class="question">
                <h3>3. Which language makes webpages interactive?</h3>

                <label>
                    <input type="radio" name="q3" value="a">
                    A) JavaScript
                </label>

                <label>
                    <input type="radio" name="q3" value="b">
                    B) HTML
                </label>

                <label>
                    <input type="radio" name="q3" value="c">
                    C) CSS
                </label>

                <label>
                    <input type="radio" name="q3" value="d">
                    D) SQL
                </label>
            </div>

            <!-- Question 4 -->
            <div class="question">
                <h3>4. Which HTML tag is used to create a hyperlink?</h3>

                <label>
                    <input type="radio" name="q4" value="a">
                    A) &lt;p&gt;
                </label>

                <label>
                    <input type="radio" name="q4" value="b">
                    B) &lt;img&gt;
                </label>

                <label>
                    <input type="radio" name="q4" value="c">
                    C) &lt;h1&gt;
                </label>

                <label>
                    <input type="radio" name="q4" value="d">
                    D) &lt;a&gt;
                </label>
            </div>

            <!-- Question 5 -->
            <div class="question">
                <h3>5. Which method selects an element by its ID?</h3>

                <label>
                    <input type="radio" name="q5" value="a">
                    A) querySelector()
                </label>

                <label>
                    <input type="radio" name="q5" value="b">
                    B) getElementById()
                </label>

                <label>
                    <input type="radio" name="q5" value="c">
                    C) innerHTML
                </label>

                <label>
                    <input type="radio" name="q5" value="d">
                    D) addEventListener()
                </label>
            </div>

            <button type="submit" id="submitBtn">Submit Quiz</button>

        </form>

        <p id="message"></p>

        <div id="result" class="result"></div>

        <button id="restartBtn">Restart Quiz</button>

        
    </div>

    <script src="script8.js"></script>
</body>
</html>
