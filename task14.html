
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style14.css">
</head>
<body>

    <div class="game-container">

        <h1>✊ Rock Paper Scissors ✋</h1>
        <p class="subtitle">Choose your move and beat the computer!</p>

        <div class="score-board">
            <div class="score-box">
                <h3>You</h3>
                <p id="userScore">0</p>
            </div>

            <div class="score-box">
                <h3>Computer</h3>
                <p id="computerScore">0</p>
            </div>
        </div>

        <h2>Choose Your Move</h2>

        <div class="choices">
            <button class="choice-btn" data-choice="rock">
                ✊
                <span>Rock</span>
            </button>

            <button class="choice-btn" data-choice="paper">
                ✋
                <span>Paper</span>
            </button>

            <button class="choice-btn" data-choice="scissors">
                ✌️
                <span>Scissors</span>
            </button>
        </div>

        <div class="result-section">
            <p id="userChoice">Your choice: -</p>
            <p id="computerChoice">Computer's choice: -</p>

            <h2 id="result">Make your first move!</h2>
            <p id="message">Good luck! 🎮</p>
        </div>

        <button id="restartBtn">🔄 Restart Game</button>

    </div>

    <script src="script14.js"></script>
</body>
</html>
