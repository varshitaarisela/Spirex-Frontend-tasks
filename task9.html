
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
    <link rel="stylesheet" href="style9.css">
</head>
<body>

    <div class="container">
        <h1>Background Color Changer</h1>

        <p class="subtitle">
            Choose your colour
        </p>

        <div class="color-buttons">
            <button id="redBtn" class="color-btn red">Red</button>
            <button id="greenBtn" class="color-btn green">Green</button>
            <button id="blueBtn" class="color-btn blue">Blue</button>
            <button id="yellowBtn" class="color-btn yellow">Yellow</button>
        </div>

        <div class="extra-buttons">
            <button id="randomBtn">Random Color</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="color-info">
            <p>Selected Color:</p>
            <h2 id="colorName">Default</h2>
            <p id="colorCode">#F3F0FF</p>
        </div>

        
    </div>

    <script src="script9.js"></script>
</body>
</html>
