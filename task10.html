
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Counter App</title>
    <link rel="stylesheet" href="style10.css">
</head>
<body>

    <div class="counter-container">

        <h1>My Counter App</h1>

        <p class="subtitle">Count your numbers easily!</p>

        <div class="counter-display">
            <h2 id="count">0</h2>
        </div>

        <div class="buttons">
            <button id="increaseBtn">Increase +1</button>

            <button id="decreaseBtn">Decrease -1</button>

            <button id="resetBtn">Reset</button>

            <button id="increaseFiveBtn">Increase +5</button>
        </div>

        <p id="message">Counter is at zero.</p>

        

    </div>

    <script src="script10.js"></script>

</body>
</html>
